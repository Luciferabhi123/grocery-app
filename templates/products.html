<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h2>Products</h2>

    {% for item in items %}
        <div class="card">
            <h3>{{item[1]}}</h3>
            <p>₹ {{item[2]}}</p>
            <a href="/add_to_cart/{{item[0]}}">
                <button>Add to Cart</button>
            </a>
        </div>
    {% endfor %}

    <a href="/cart"><button>View Cart</button></a>
</div>

</body>
</html>
